[project]
name = "piewall"
version = "0.1.0"
description = "Manage Windows Firewall rules from a simple window or the command line"
readme = "README.md"
authors = [
    { name = "theeraphat.ch", email = "theeraphatchueanokkhum@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "darkdetect>=0.8.0",
    "psutil>=7.2.2",
    "pywin32>=312",
    "sv-ttk>=2.6.1",
]

[project.scripts]
piewall = "piewall.cli:main"

[project.gui-scripts]
piewall-gui = "piewall.gui:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["tests"]
